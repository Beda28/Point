services:
  nginx:
    container_name: commerce-nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - commerce

  frontend:
    container_name: commerce-frontend
    build: ./frontend
    volumes:
      - frontend-dist:/dist
    networks:
      - commerce

  backend:
    container_name: commerce-backend
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      NODE_ENV: ${NODE_ENV:-development}
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      POINT_BASE_URL: ${POINT_BASE_URL}
      POINT_API_KEY: ${POINT_API_KEY}
      TEST_CHARGE_ENABLED: ${TEST_CHARGE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - commerce

  db:
    container_name: commerce-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - commerce-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - commerce


volumes:
  frontend-dist:
    name: commerce_frontend-dist
  commerce-mysql-data:
    name: commerce_mysql-data

networks:
  commerce:
    name: commerce-network
